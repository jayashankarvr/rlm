[package]
name = "rlmctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Unprivileged cgroup v2 limits and a freeze guard for your own Linux processes"
readme = "../README.md"
keywords = ["cgroups", "resource-limit", "memory", "systemd", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
# Reads README.md and CLAUDE.md from the repo root, which are not in the published crate.
exclude = ["tests/doc_config_examples.rs"]

[package.metadata.deb]
name = "rlm"
maintainer = "Jayashankar <me.jayashankar@gmail.com>"
section = "admin"
priority = "optional"
depends = "$auto, systemd"
extended-description = "rlm sets unprivileged cgroup v2 memory, CPU and I/O limits on your own processes through systemd user delegation. rlm-guard is a per-user daemon that freezes or caps a runaway app under memory pressure instead of killing it."
assets = [
    ["target/release/rlm", "usr/bin/", "755"],
    ["target/release/rlm-guard", "usr/bin/", "755"],
    ["assets/rlm-guard.service", "usr/lib/systemd/user/", "644"],
    ["../README.md", "usr/share/doc/rlm/", "644"],
    ["../dist/rlm-delegate.conf", "etc/systemd/system/user@.service.d/rlm-delegate.conf", "644"],
]
maintainer-scripts = "../dist/deb"

[package.metadata.generate-rpm]
name = "rlm"
assets = [
    { source = "target/release/rlm", dest = "/usr/bin/rlm", mode = "755" },
    { source = "target/release/rlm-guard", dest = "/usr/bin/rlm-guard", mode = "755" },
    { source = "assets/rlm-guard.service", dest = "/usr/lib/systemd/user/rlm-guard.service", mode = "644" },
    { source = "../README.md", dest = "/usr/share/doc/rlm/README.md", mode = "644" },
    { source = "../dist/rlm-delegate.conf", dest = "/etc/systemd/system/user@.service.d/rlm-delegate.conf", mode = "644", config = "noreplace" },
]
post_install_script = "../dist/rpm/post"
pre_uninstall_script = "../dist/rpm/preun"
post_uninstall_script = "../dist/rpm/postun"

[[bin]]
name = "rlm"
path = "src/main.rs"

[[bin]]
name = "rlm-guard"
path = "src/bin/rlm-guard.rs"

[dependencies]
common.workspace = true
rlm-core.workspace = true
clap.workspace = true
tracing.workspace = true
ctrlc.workspace = true
dirs.workspace = true
libc = "0.2.178"
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3"
