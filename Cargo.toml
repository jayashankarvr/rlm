[workspace]
resolver = "2"
members = ["cli", "rlm-core", "common", "gtk-gui", "harness"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jayashankarvr/rlm"
homepage = "https://github.com/jayashankarvr/rlm"
rust-version = "1.87"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "6.0"

common = { package = "rlmctl-common", path = "common", version = "0.2.3" }
rlm-core = { package = "rlmctl-core", path = "rlm-core", version = "0.2.3" }
