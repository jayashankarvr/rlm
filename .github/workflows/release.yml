name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          want="${REF_NAME#v}"
          have="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="rlmctl") | .version')"
          test "$want" = "$have" || { echo "tag $REF_NAME does not match Cargo version $have"; exit 1; }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Build .deb packages
        run: |
          cargo deb -p rlmctl --no-build
          cargo deb -p rlm-gtk --no-build

      - name: Build .rpm packages
        run: |
          cargo generate-rpm -p cli
          cargo generate-rpm -p gtk-gui

      - name: Create tarball
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp target/release/rlm release/
          cp target/release/rlm-guard release/
          cp target/release/rlm-gtk release/
          cp cli/assets/rlm-guard.service release/
          cp dist/rlm-delegate.conf release/
          cp README.md LICENSE release/
          tar -czvf "rlm-${REF_NAME}-x86_64-linux.tar.gz" -C release .

      - name: Write checksums
        run: sha256sum target/debian/*.deb target/generate-rpm/*.rpm rlm-*.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            rlm-${{ github.ref_name }}-x86_64-linux.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
