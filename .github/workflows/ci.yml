name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: Build CLI & Core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --release -p rlmctl -p rlmctl-core -p rlmctl-common

      - name: Run tests
        run: cargo test -p rlmctl -p rlmctl-core -p rlmctl-common

      - name: Run clippy
        run: cargo clippy -p rlmctl -p rlmctl-core -p rlmctl-common --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check docs against the code
        run: scripts/check-docs.sh

  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87

      - name: Build CLI and core
        run: cargo build --locked -p rlmctl -p rlmctl-core -p rlmctl-common

      - name: Run tests
        run: cargo test --locked -p rlmctl -p rlmctl-core -p rlmctl-common

  build-gui:
    name: Build GUI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            pkg-config

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}

      - name: Build GUI
        run: cargo build --release -p rlm-gtk

      - name: Run clippy on GUI
        run: cargo clippy -p rlm-gtk --all-targets -- -D warnings

  security-audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
